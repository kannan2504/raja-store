<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ed" />
    <meta name="description" content="Shop thoughtfully selected everyday goods from Raja Store with secure COD and UPI ordering in Chennai." />
    <link rel="canonical" href="https://raja-store.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Raja Store" />
    <meta property="og:url" content="https://raja-store.vercel.app/" />
    <meta property="og:title" content="Raja Store | Everyday goods, chosen well" />
    <meta property="og:description" content="Shop thoughtfully selected everyday goods from Raja Store with secure COD and UPI ordering in Chennai." />
    <meta property="og:image" content="https://raja-store.vercel.app/images/rajastore_upi.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raja Store | Everyday goods, chosen well" />
    <meta name="twitter:description" content="Shop thoughtfully selected everyday goods from Raja Store with secure COD and UPI ordering in Chennai." />
    <meta name="twitter:image" content="https://raja-store.vercel.app/images/rajastore_upi.png" />

    <!-- Structured Data (Site & Organization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://raja-store.vercel.app/#organization",
          "name": "Raja Store",
          "url": "https://raja-store.vercel.app/",
          "logo": "https://raja-store.vercel.app/images/rajastore_upi.png",
          "description": "Everyday kitchen and household essentials delivered in Chennai."
        },
        {
          "@type": "WebSite",
          "@id": "https://raja-store.vercel.app/#website",
          "url": "https://raja-store.vercel.app/",
          "name": "Raja Store",
          "publisher": {
            "@id": "https://raja-store.vercel.app/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://raja-store.vercel.app/products?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <title>Raja Store | Everyday goods, chosen well</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
